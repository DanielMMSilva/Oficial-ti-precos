<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghenady Tec | Cursos de manutenção de celulares em Belo Horizonte</title>
<meta name="description" content="Cursos presenciais em Belo Horizonte e curso online de manutenção de celulares e reparo de placas Android. Microssoldagem, esquema elétrico e fonte assimétrica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a1226;
  --deep:#0e1930;
  --line:#2b4170;
  --text:#e6ecf7;
  --muted:#93a1bf;
  --cyan:#5fe0ff;
  --wa:#25d366;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(900px 520px at 90% -12%, rgba(54,197,240,.30), transparent 62%),
    radial-gradient(760px 480px at -12% 45%, rgba(245,165,36,.13), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, rgba(54,197,240,.22), transparent 65%),
    var(--ink);
  color:var(--text);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;
  line-height:1.6;
}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}

/* cabeçalho */
header{
  border-bottom:1px solid rgba(95,224,255,.45);
  box-shadow:0 12px 45px -12px rgba(54,197,240,.55);
  background:rgba(10,18,38,.85);
}
header .wrap{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;flex-wrap:wrap;gap:12px 24px;padding-top:18px;padding-bottom:18px;
}
.mark{
  font-family:"Barlow Condensed",sans-serif;font-weight:800;
  font-size:1.6rem;letter-spacing:.03em;color:var(--text);text-decoration:none;
  display:flex;justify-content:center;
  text-shadow:0 0 18px rgba(54,197,240,.85), 0 0 4px rgba(255,255,255,.35);
}
.mark b{color:var(--cyan);font-weight:800}
nav{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--text)}

/* abertura */
.hero{padding:88px 0 80px;position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;right:-80px;top:0;bottom:0;width:55%;
  background:
    linear-gradient(var(--line) 1px,transparent 1px) 0 40px/100% 40px,
    linear-gradient(90deg,var(--line) 1px,transparent 1px) 60px 0/60px 100%;
  opacity:.35;
  mask-image:linear-gradient(90deg,transparent,#000 60%);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);
  pointer-events:none;
}
.hero .wrap{position:relative}
h1{
  font-family:"Barlow Condensed",sans-serif;font-weight:800;
  font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.02;
  margin:0 0 24px;max-width:15ch;letter-spacing:-.005em;
  text-shadow:0 0 28px rgba(54,197,240,.55), 0 0 6px rgba(255,255,255,.12);
}
.lead{font-size:1.15rem;color:var(--muted);max-width:52ch;margin:0 0 36px}
.actions{display:flex;gap:14px;flex-wrap:wrap}

.btn{
  display:inline-block;padding:14px 22px;border-radius:4px;
  font-weight:600;text-decoration:none;font-size:1rem;
  border:1px solid transparent;transition:background .2s,color .2s,border-color .2s,box-shadow .2s;
}
.btn-wa{background:var(--wa);color:#06210f;box-shadow:0 0 26px rgba(37,211,102,.55), 0 0 60px rgba(37,211,102,.25)}
.btn-wa:hover{background:#2ee673;box-shadow:0 0 36px rgba(37,211,102,.8), 0 0 80px rgba(37,211,102,.35)}
.btn-line{border-color:rgba(95,224,255,.6);color:var(--text);box-shadow:0 0 18px rgba(54,197,240,.25)}
.btn-line:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 28px rgba(54,197,240,.6)}

/* seções */
section{padding:72px 0;border-top:1px solid var(--line)}
h2{
  font-family:"Barlow Condensed",sans-serif;font-weight:800;
  font-size:2.1rem;margin:0 0 10px;line-height:1.1;
  text-shadow:0 0 28px rgba(54,197,240,.55), 0 0 6px rgba(255,255,255,.12);
}
.intro{color:#b7c6e3;margin:0 0 40px;max-width:60ch}

/* lista de cursos */
.item{
  display:grid;grid-template-columns:1fr auto;gap:8px 32px;
  padding:28px 0;border-top:1px solid rgba(95,224,255,.25);
}
.item:first-of-type{border-top:0;padding-top:0}
.item h3{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:1.5rem;margin:0 0 6px;line-height:1.15;
  text-shadow:0 0 14px rgba(54,197,240,.25);
}
.item p{margin:0;color:#b7c6e3;max-width:62ch}
.side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:180px}
.price{
  font-family:"Barlow Condensed",sans-serif;font-weight:800;
  font-size:1.6rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;
  text-shadow:0 0 16px rgba(95,224,255,.55);
}
.price small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.9rem;color:var(--muted);margin-top:6px}
.note{font-size:.92rem;color:var(--warm,#f5a524);margin:0}
.note.soft{color:var(--muted)}
.item .btn{padding:10px 16px;font-size:.95rem}

/* faixa do curso online */
.online{background:linear-gradient(180deg,rgba(54,197,240,.10),transparent 70%),var(--deep)}
.online .item{border-top:0;padding:0}
.online h3{font-size:1.9rem}

/* materiais */
.materials{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.materials .item:first-of-type{padding-top:28px;border-top:1px solid rgba(95,224,255,.25)}
@media (max-width:700px){
  .materials{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .side{text-align:left;align-items:flex-start;min-width:0}
}

/* quem ensina */
.teacher{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:40px;align-items:center}
.teacher figure{margin:0}
.teacher img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid rgba(95,224,255,.6);box-shadow:0 0 40px rgba(54,197,240,.5),0 0 110px rgba(54,197,240,.3)}
.teacher h2{margin-bottom:6px}
.teacher .role{color:var(--cyan);font-weight:600;margin:0 0 18px;text-shadow:0 0 14px rgba(95,224,255,.5)}
.teacher p{color:#b7c6e3;margin:0 0 14px;max-width:56ch}
@media (max-width:700px){.teacher{grid-template-columns:1fr;gap:24px}}

/* contato */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}
.contact dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px}
.contact dt{color:var(--muted)}
.contact dd{margin:0}
.contact a{color:var(--text)}
@media (max-width:700px){.contact{grid-template-columns:1fr}}

footer{border-top:1px solid rgba(95,224,255,.35);box-shadow:0 -12px 40px -16px rgba(54,197,240,.45);padding:28px 0;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px}

/* JANELA DE VÍDEO FLUTUANTE (MINI-PLAYER SOBREPOSTO) */
.floating-video{
  position:fixed;
  right:20px;
  bottom:20px;
  width:280px;
  z-index:9999;
  border-radius:12px;
  overflow:hidden;
  background:#050b18;
  border:1px solid rgba(95,224,255,.75);
  box-shadow:
    0 14px 36px rgba(0,0,0,.85),
    0 0 24px rgba(54,197,240,.45);
  transition:opacity .25s ease, transform .25s ease;
}
.floating-video.is-hidden{
  opacity:0;
  pointer-events:none;
  transform:translateY(16px) scale(.96);
}
.floating-video video{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#050b18;
}
.close-video{
  position:absolute;
  top:6px;
  right:6px;
  width:26px;
  height:26px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(10,18,38,.85);
  color:#fff;
  font-size:16px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
  padding:0;
  transition:background .2s, border-color .2s, transform .15s;
}
.close-video:hover{
  background:#e11d48;
  border-color:#fda4af;
  transform:scale(1.08);
}
@media (max-width:480px){
  .floating-video{
    width:210px;
    right:12px;
    bottom:12px;
  }
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>
